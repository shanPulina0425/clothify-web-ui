
<app-navbar [cartCount]="myCart.length"
            (cartClicked)="toggleCart()">
</app-navbar>

<div class="main-container">
    <h2>Our Latest Products</h2>

    <router-outlet></router-outlet>


        @if(isCartVisible) {
            <app-cart-summary 
            [cartItems]="myCart"
            (closePopup)="toggleCart()"

            (removeItem)="onRemoveFromCart($event)">
            </app-cart-summary>

        }
</div>
