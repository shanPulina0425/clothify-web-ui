
<app-navbar [cartCount]="myCart.length"
            (cartClicked)="toggleCart()">
</app-navbar>

<div class="main-container">
    <h2>Our Latest Products</h2>

    <div class="product-grid">

        @for (item of productList; track item.id) {


            <app-product-card [item]="item"
            (itemAdded)="onAddToCart($event)" >

            </app-product-card>
            
        }

        
        </div>

        @if(isCartVisible) {
            <app-cart-summary 
            [cartItems]="myCart">
            (closedPopup)="toggleCart()">
            </app-cart-summary>

        }
</div>
