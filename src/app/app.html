
<app-navbar [cartCount]="myCart.length"></app-navbar>

<div class="main-container">
    <h2>Our Latest Products</h2>

    <div class="product-grid">

        @for (item of productList; track item.id) {


            <app-product-card [item]="item"
            (itemAdded)="onAddToCart($event)" >

            </app-product-card>
            
        }
        
        <app-cart-summary [cartItems]="myCart"></app-cart-summary>


    </div>
</div>
