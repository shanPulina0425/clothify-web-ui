<div class="modal-overlay">

<div class="summary-box">

    <div class="modal-header">
        <h3>🛒 Cart Summary</h3>
        <button class="close-btn" (click)="closePopup.emit()">×</button>
    </div>
  

  
  @if (cartItems.length === 0) {
    <p class="empty-msg">Your cart is empty. Add some products!</p>
  } 
  
  @else {
    <ul class="item-list">
      @for (item of cartItems; track item.id) {
        <li>
          <span>{{ item.name }}
            <strong style="color: blue;"> x{{ item.quantity }}</strong>
          </span>
          <span>Rs. {{ item.price * (item.quantity || 1)}}</span>

          <button style="color: red; border: none; background: none; cursor: pointer;" 
                  (click)="removeItem.emit(item.id)">
            🗑️
          </button>
          
        </li>
      }
    </ul>

    <hr>
    
    <div class="total-row">
      <strong>Total Amount:</strong>
      
      <strong class="price">Rs. {{ totalPrice }}</strong> 
    </div>

    <button class="checkout-btn" (click)="checkout.emit()">Proceed to Checkout</button>
  }
</div>
</div>
